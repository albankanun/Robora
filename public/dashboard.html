<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robora — Staff Dashboard</title>
<style>
  :root{--ink:#0C1222;--panel:#111A30;--cyan:#2BD9C7;--teal:#0FA79A;--cloud:#F1F4F7;--slate:#8B98AB;--line:rgba(139,152,171,.18);--green:#8FD14F;--blue:#4EA8F0}
  *{box-sizing:border-box}
  body{margin:0;background:#0A0F1C;color:var(--cloud);font-family:Inter,system-ui,sans-serif}
  header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#0A0F1C;z-index:5}
  header h1{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:19px;margin:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-left:6px;animation:live 2s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(143,209,79,.5)}100%{box-shadow:0 0 0 10px rgba(143,209,79,0)}}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .col h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--cyan);margin:0 0 12px;letter-spacing:.03em;text-transform:uppercase}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .item.fresh{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
  .item .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .item .who{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px}
  .item .id{color:var(--slate);font-size:11px;font-family:monospace}
  .item .meta{color:var(--slate);font-size:12.5px;margin:4px 0 8px}
  .lines{font-size:13.5px;color:#C6CFDB;line-height:1.6;white-space:pre-wrap}
  .totals{margin-top:8px;font-size:13px}
  .totals .now{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--cyan);font-size:16px}
  .badge{font-size:11px;font-family:'Space Grotesk',sans-serif;padding:3px 9px;border-radius:999px;background:rgba(43,217,199,.12);color:var(--cyan);border:1px solid rgba(43,217,199,.3)}
  .empty{color:var(--slate);font-size:13.5px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:14px}
  .toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1px solid var(--cyan);border-radius:14px;padding:14px 18px;box-shadow:0 16px 50px rgba(0,0,0,.5);animation:in .3s ease;z-index:20;max-width:320px}
  .toast .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--cyan);margin-bottom:3px}
  .toast .m{font-size:13px;color:#C6CFDB}
</style>
</head>
<body>
  <header>
    <svg width="26" height="26" viewBox="0 0 52 52"><circle cx="26" cy="26" r="18" fill="none" stroke="var(--cyan)" stroke-width="5.5" stroke-linecap="round" pathLength="100" stroke-dasharray="74 26"/><circle cx="38.3" cy="12.9" r="3.6" fill="var(--cyan)"/></svg>
    <h1>Robora — Staff Dashboard</h1><span class="dot" title="live"></span>
    <button id="logoutBtn" onclick="roboraLogout()" style="margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--slate);border-radius:999px;padding:8px 16px;font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer">Log out</button>
  </header>
  <div class="wrap">
    <div class="col"><h2>Reservations</h2><div id="preorders"></div></div>
    <div class="col"><h2>Messages</h2><div id="messages"></div></div>
  </div>
<script>
// Log out: send the user away. To fully clear the saved login, the browser
// is navigated to a logout URL that returns 401, which clears Basic Auth in most browsers.
function roboraLogout(){
  if(!confirm('Log out of the dashboard?')) return;
  // Navigate to a URL that will 401 with fresh (empty) credentials embedded,
  // which clears the browser's stored Basic Auth, then bounce to the site.
  var u = location.origin.replace('://', '://log:out@');
  var img = new Image();
  img.src = u + '/api/state?ts=' + Date.now(); // triggers a 401 with bad creds
  setTimeout(function(){ window.location.href = 'https://robora.eu/'; }, 400);
}
</script>
<script>
const PRE=document.getElementById('preorders'), MSG=document.getElementById('messages');
let state={preorders:[],messages:[]};
function eur(n){ return '€'+Number(n).toFixed(2); }
function when(iso){ return new Date(iso).toLocaleString(); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function srcTag(o){
  var web = o.source==='web';
  var bg = web?'rgba(78,168,240,.15)':'rgba(43,217,199,.12)';
  var col= web?'#4EA8F0':'#2BD9C7';
  var bd = web?'rgba(78,168,240,.4)':'rgba(43,217,199,.3)';
  var label = web?'🌐 Web':'💬 Rina';
  return '<span class="badge" style="background:'+bg+';color:'+col+';border-color:'+bd+'">'+label+'</span>';
}
function renderPre(){
  if(!state.preorders.length){ PRE.innerHTML='<div class="empty">No reservations yet. Web and chat orders appear here live.</div>'; return; }
  PRE.innerHTML=state.preorders.slice().reverse().map(o=>`
    <div class="item" data-id="${o.id}">
      <div class="top"><span class="who">${esc(o.name)}</span><span>${srcTag(o)} ${o.language?'<span class="badge">'+esc(o.language)+'</span>':''}</span></div>
      <div class="meta">${esc(o.email)} · ${esc(o.phone)} · <span class="id">${o.id}</span></div>
      <div class="lines">${o.lines && o.lines.length ? o.lines.map(l=>esc(l.name)+' × '+l.quantity+' — '+eur(l.line_total)).join('<br>') : esc(o.raw_order||'')}</div>
      <div class="totals"><span class="now">${eur(o.preorder_total)}</span></div>
      ${o.note?`<div class="meta" style="margin-top:6px">📝 ${esc(o.note)}</div>`:''}
      <div class="meta" style="margin-top:6px">${when(o.createdAt)}</div>
    </div>`).join('');
}
function renderMsg(){
  if(!state.messages.length){ MSG.innerHTML='<div class="empty">No messages yet.</div>'; return; }
  MSG.innerHTML=state.messages.slice().reverse().map(m=>`
    <div class="item" data-id="${m.id}">
      <div class="top"><span class="who">${esc(m.name||'Anonymous')}</span><span class="badge">${esc(m.topic||'general')}</span></div>
      ${m.contact?`<div class="meta">${esc(m.contact)}</div>`:''}
      <div class="lines">${esc(m.message)}</div>
      <div class="meta" style="margin-top:6px">${when(m.createdAt)}</div>
    </div>`).join('');
}
function toast(title,msg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML='<div class="t">'+esc(title)+'</div><div class="m">'+esc(msg)+'</div>'; document.body.appendChild(t); setTimeout(()=>t.remove(),6000); }
function flash(id){ setTimeout(()=>{ const el=document.querySelector('[data-id="'+id+'"]'); if(el){ el.classList.add('fresh'); setTimeout(()=>el.classList.remove('fresh'),4000);} },50); }

const proto=location.protocol==='https:'?'wss':'ws';
let ws;
function connect(){
  ws=new WebSocket(`${proto}://${location.host}/ws/dashboard`);
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    if(m.type==='snapshot'){ state=m.data; renderPre(); renderMsg(); }
    else if(m.type==='preorder'){ state.preorders.push(m.order); renderPre(); flash(m.order.id);
      toast('New reservation — '+(m.channel==='web'?'🌐 Web':'💬 Rina'), m.order.name+' · '+eur(m.order.preorder_total)); }
    else if(m.type==='message'){ state.messages.push(m.msg); renderMsg(); flash(m.msg.id);
      toast('New message — 💬 Rina', (m.msg.topic||'general')); }
  };
  ws.onclose=()=>setTimeout(connect,1500);
}
connect();
</script>
</body>
</html>
